# Netlify build + routing config
[build]
  command = "npm run build"
  publish = "dist"
  functions = "functions"

[build.environment]
  NODE_VERSION = "22"

# Everything under /api/* (bookings, technicians, auth, availability, tracking…)
# is served by functions/api.js. That function declares its own route with
# Netlify Functions v2 `config.path`, so no rewrite rule is needed for it.
#
# The AI assistant is deliberately routed separately: it talks only to an
# external AI API, so keeping it on its own function means the chat keeps
# working even if the database is unavailable.
[[redirects]]
  from = "/api/assistant"
  to = "/.netlify/functions/assistant"
  status = 200

# SPA fallback — React Router renders every route from index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
